
<html>
<head>
    <title>EJERCICIO 13</title>

    <style>
    
        input[type="text"] {
            border: 1px solid #C5C5C5;
            font-family: Arial;
            font-size: 12px;
            color: #666666;
            padding: 5px;
        }

        textarea {
            border: 1px solid #C5C5C5;
            font-family: Arial;
            font-size: 12px;
            color: #666666;
            padding: 5px;
        }

   
        input[type="reset"],
        input[type="submit"] {
            border: 1px solid #666666;
            font-family: Arial;
            font-size: 12px;
            color: #666666;
            background-color: #EEEEEE;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

<form>

    Nombre:
    <input type="text" maxlength="25">
    <br><br>

    Apellido:
    <input type="text" maxlength="25">
    <br><br>

    Dirección:
    <br>
    <textarea maxlength="30"></textarea>
    <br><br>

    Teléfono:
    <input type="text" maxlength="15" value="0299">
    <br><br>

    Operación:
    <br>
    <input type="radio" name="op" checked> Compra
    <input type="radio" name="op"> Alquiler
    <br><br>

    Zonas:
    <br>
    <input type="checkbox" checked> Zona Centro
    <br>
    <input type="checkbox"> Zona Norte
    <br>
    <input type="checkbox" checked> Zona Sur
    <br><br>

    Comentario:
    <br>
    <textarea rows="5" cols="30"></textarea>
    <br><br>

    <input type="reset" value="Resetear">
    <input type="submit" value="Enviar">

</form>

</body>
</html>
